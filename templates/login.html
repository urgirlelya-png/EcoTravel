{% extends "base.html" %}
{% block title %}EcoTrip Planner — Log in{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-bg-orb auth-orb-1"></div>
  <div class="auth-bg-orb auth-orb-2"></div>

  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;padding:6rem 1rem;">
    <div class="auth-card animate-fadeup">

      <div class="auth-card-logo">
        <div class="brand-icon-wrap" style="width:52px;height:52px;font-size:1.4rem;margin:0 auto 1rem;">
          <i class="bi bi-tree-fill text-white"></i>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to continue tracking your eco footprint</p>
      </div>

      {% if error %}
      <div class="auth-error">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" novalidate>
        <div class="auth-field">
          <label class="auth-label">
            <i class="bi bi-person-fill"></i> Username
          </label>
          <input type="text" class="auth-input" name="username"
                 placeholder="Your username" autocomplete="username" required>
        </div>

        <div class="auth-field">
          <label class="auth-label">
            <i class="bi bi-lock-fill"></i> Password
          </label>
          <div class="auth-input-wrap">
            <input type="password" class="auth-input" name="password" id="loginPwd"
                   placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="auth-eye" onclick="togglePwd('loginPwd',this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit">
          <i class="bi bi-box-arrow-in-right me-2"></i>Log in
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <p class="auth-switch">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one free</a>
      </p>

    </div>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const ico = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    ico.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
